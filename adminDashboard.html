<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CivicSnap – Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b2a41; --muted:#5d6b7f; --line:#dbe1ea; --bg:#eef2f6; --card:#ffffff;
  --brand:#0e6b5c;
  --s-reported:#b45309; --s-reported-bg:#fdecd0;
  --s-ack:#1d4ed8; --s-ack-bg:#dbe7fd;
  --s-prog:#7c3aed; --s-prog-bg:#e9defc;
  --s-done:#15803d; --s-done-bg:#d6f3df;
  --danger:#b91c1c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Public Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;display:flex;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}

.sidebar{width:230px;background:var(--ink);color:#e6ecf5;padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.logo{font-size:1.35rem;font-weight:700;margin-bottom:22px;padding-left:8px}
.logo span{color:#5eead4}
.sidebar a{display:block;padding:10px 12px;border-radius:8px;color:#c4cfdf;text-decoration:none;font-weight:500}
.sidebar a:hover{background:#2a3b57}
.sidebar a.active{background:var(--brand);color:#fff}
.sidebar .me{margin-top:auto;font-size:.85rem;padding:10px 8px;border-top:1px solid #32445f;color:#9fb0c8}
.sidebar .me .btn{margin-top:8px;color:var(--ink)}

main{flex:1;padding:26px 30px;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:22px}
h1{font-size:1.6rem}
.topbar p{color:var(--muted);font-size:.92rem}
.menu-btn{display:none;background:var(--ink);color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;border-left:5px solid var(--c,var(--brand))}
.stat b{display:block;font-size:2rem;line-height:1.1}
.stat span{color:var(--muted);font-size:.9rem}

.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:22px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.panel h2{font-size:1.05rem;margin-bottom:14px}
.bar-row{display:grid;grid-template-columns:150px 1fr 28px;gap:10px;align-items:center;margin-bottom:10px;font-size:.9rem}
.bar{height:12px;background:#e6ebf2;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:6px;transition:width .4s}
.pipe{display:flex;flex-direction:column;gap:10px}
.pipe div{display:flex;justify-content:space-between;padding:10px 12px;border-radius:8px;font-weight:600}

.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.8rem;font-weight:600;white-space:nowrap}
.Reported{background:var(--s-reported-bg);color:var(--s-reported)}
.Acknowledged{background:var(--s-ack-bg);color:var(--s-ack)}
.InProgress{background:var(--s-prog-bg);color:var(--s-prog)}
.Resolved{background:var(--s-done-bg);color:var(--s-done)}

.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters input,.filters select{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.filters input{flex:1;min-width:200px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;padding:10px;color:var(--muted);font-weight:600;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#f6f9fc}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#cfd8e3;flex-shrink:0;margin-right:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.cell-issue{display:flex;align-items:center}
.cell-issue small{color:var(--muted);display:block}
.btn{border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.btn.small{padding:4px 10px;font-size:.8rem}
.btn:hover{background:#f1f5f9}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#0b5a4d}
.btn.danger{color:var(--danger)}
.empty{text-align:center;padding:34px 10px;color:var(--muted)}

.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:12px;width:100%;max-width:680px;max-height:92vh;overflow:auto;padding:24px}
.modal header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.modal h3{font-size:1.25rem}
.close{border:0;background:none;font-size:1.6rem;cursor:pointer;line-height:1}
.meta{color:var(--muted);font-size:.9rem;margin-bottom:14px}
#mMap a{color:var(--brand);font-weight:600}
.steps{display:flex;gap:6px;margin:14px 0 18px}
.steps div{flex:1;text-align:center;font-size:.78rem;font-weight:600;padding:8px 4px;border-radius:6px;background:#e6ebf2;color:var(--muted)}
.steps div.done{background:var(--brand);color:#fff}
.imgs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.imgbox{border:2px dashed var(--line);border-radius:10px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;text-align:center;font-size:.88rem;color:var(--muted)}
.imgbox img{max-width:100%;max-height:150px;border-radius:8px}
label{font-weight:600;font-size:.9rem;display:block;margin:10px 0 4px}
.modal select,.modal textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:8px;transition:transform .3s;z-index:99}
#toast.show{transform:translateX(-50%) translateY(0)}

@media(max-width:900px){
  .grid2{grid-template-columns:1fr}
  .sidebar{position:fixed;left:-250px;z-index:40;transition:left .25s}
  .sidebar.open{left:0}
  .menu-btn{display:inline-block}
  main{padding:18px 14px}
  .bar-row{grid-template-columns:110px 1fr 24px}
}
@media(max-width:520px){.imgs{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="logo">Civic<span>Snap</span></div>
  <a href="#overview" class="active">Overview</a>
  <a href="#reports">All reports</a>
  <a href="#categories">Categories</a>
  <div class="me">
    Signed in as<br><b id="adminName">Admin</b><br>
    <button class="btn small" id="logoutBtn">Log out</button>
  </div>
</aside>

<main>
  <div class="topbar">
    <div>
      <h1>Admin dashboard</h1>
      <p>Review, update and resolve issues reported by citizens.</p>
    </div>
    <button class="menu-btn" id="menuBtn">☰ Menu</button>
  </div>

  <section id="overview">
    <div class="stats" id="stats"></div>
    <div class="grid2">
      <div class="panel" id="categories">
        <h2>Reports by category</h2>
        <div id="catBars"></div>
      </div>
      <div class="panel">
        <h2>Status pipeline</h2>
        <div class="pipe" id="pipe"></div>
      </div>
    </div>
  </section>

  <section class="panel" id="reports">
    <h2>Reported issues</h2>
    <div class="filters">
      <input type="search" id="search" placeholder="Search by title, location or ID" aria-label="Search reports">
      <select id="fCat" aria-label="Filter by category"></select>
      <select id="fStatus" aria-label="Filter by status"></select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>ID</th><th>Issue</th><th>Location</th><th>Date</th><th>Status</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal">
    <header>
      <h3 id="mTitle"></h3>
      <button class="close" id="closeBtn" aria-label="Close">×</button>
    </header>
    <div class="meta" id="mMeta"></div>
    <p id="mDesc"></p>
    <p id="mMap"></p>
    <div class="steps" id="mSteps"></div>

    <label for="mStatus">Update status</label>
    <select id="mStatus"></select>

    <label for="mCat">Category</label>
    <select id="mCat"></select>

    <label for="mNote">Note to citizen (optional)</label>
    <textarea id="mNote" rows="2" placeholder="e.g. Crew assigned, repair expected in 2 days"></textarea>

    <div class="imgs">
      <div class="imgbox"><b>Before</b><div id="beforeBox"></div></div>
      <div class="imgbox"><b>After (resolved)</b><div id="afterBox"></div>
        <input type="file" id="afterFile" accept="image/*" aria-label="Upload after image">
      </div>
    </div>

    <div class="actions">
      <button class="btn danger" id="deleteBtn">Delete report</button>
      <div>
        <button class="btn" id="cancelBtn">Cancel</button>
        <button class="btn primary" id="saveBtn">Save changes</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" role="status"></div>
<script>
/* =====================================================================
   CivicSnap – Admin dashboard
   ---------------------------------------------------------------------
   INTEGRATION SETTINGS (share these with your team)
   ===================================================================== */
const CONFIG = {
  USE_BACKEND: false,                  // false = shared browser storage (for testing), true = real API
  API_BASE: "http://localhost:5000/api",
  REPORTS_KEY: "civicsnap_reports",    // localStorage key: the report page SAVES here, admin page READS here
  USER_KEY: "civicsnap_user",          // localStorage key: the login page SAVES the logged-in user here
  LOGIN_PAGE: "login.html",            // where to send people who are not logged in as admin
  REQUIRE_ADMIN_LOGIN: false           // set to true once the login page is ready
};

/* Report object every page must use:
{
  id: "CS-1001",
  title: "Large pothole near bus stop",
  category: "Road & Potholes",               // must be one of CATEGORIES below
  description: "Deep pothole...",
  location: { address: "MG Road", lat: 12.97, lng: 77.59 },
  photo: "data:image/jpeg;base64,..." or image URL,   // before image
  afterPhoto: null,                                    // added by admin
  status: "Reported",                        // Reported | Acknowledged | In Progress | Resolved
  reportedBy: "Asha R.",
  createdAt: "2026-10-15T10:30:00.000Z",
  adminNote: ""
}
User object saved by login page: { name:"...", email:"...", role:"admin" } or role:"user"
*/

const CATEGORIES = ["Road & Potholes","Waste Management","Drainage & Sanitation","Street Lighting","Public Infrastructure","Water-related Issues","Other"];
const STATUSES = ["Reported","Acknowledged","In Progress","Resolved"];
const ICONS = {"Road & Potholes":"🛣️","Waste Management":"🗑️","Drainage & Sanitation":"🚰","Street Lighting":"💡","Public Infrastructure":"🏗️","Water-related Issues":"💧","Other":"📌"};

/* ---------------------------- Data layer ---------------------------- */
const Store = {
  async getAll(){
    if (CONFIG.USE_BACKEND){
      const res = await fetch(`${CONFIG.API_BASE}/reports`, { headers: authHeader() });
      if (!res.ok) throw new Error("Could not load reports");
      return res.json();
    }
    return JSON.parse(localStorage.getItem(CONFIG.REPORTS_KEY) || "[]");
  },
  async update(report){
    if (CONFIG.USE_BACKEND){
      const res = await fetch(`${CONFIG.API_BASE}/reports/${report.id}`, {
        method: "PUT", headers: { "Content-Type":"application/json", ...authHeader() },
        body: JSON.stringify(report)
      });
      if (!res.ok) throw new Error("Could not save report");
      return;
    }
    const all = await this.getAll();
    localStorage.setItem(CONFIG.REPORTS_KEY, JSON.stringify(all.map(r => r.id === report.id ? report : r)));
  },
  async remove(id){
    if (CONFIG.USE_BACKEND){
      const res = await fetch(`${CONFIG.API_BASE}/reports/${id}`, { method:"DELETE", headers: authHeader() });
      if (!res.ok) throw new Error("Could not delete report");
      return;
    }
    const all = await this.getAll();
    localStorage.setItem(CONFIG.REPORTS_KEY, JSON.stringify(all.filter(r => r.id !== id)));
  }
};

function currentUser(){ try { return JSON.parse(localStorage.getItem(CONFIG.USER_KEY)); } catch { return null; } }
function authHeader(){ const u = currentUser(); return u && u.token ? { Authorization: "Bearer " + u.token } : {}; }

/* ---------------------------- Login guard --------------------------- */
const user = currentUser();
if (CONFIG.REQUIRE_ADMIN_LOGIN && (!user || user.role !== "admin")) {
  window.location.href = CONFIG.LOGIN_PAGE;
}
document.getElementById("adminName").textContent = user && user.name ? user.name : "Admin";
document.getElementById("logoutBtn").addEventListener("click", () => {
  localStorage.removeItem(CONFIG.USER_KEY);
  window.location.href = CONFIG.LOGIN_PAGE;
});

/* ----------------------------- Helpers ------------------------------ */
const $ = id => document.getElementById(id);
const cls = s => s.replace(/\s/g, "");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const badge = s => `<span class="badge ${cls(s)}">${esc(s)}</span>`;
const addr = r => (r.location && r.location.address) || "Location not provided";
const fmtDate = d => d ? new Date(d).toLocaleDateString("en-IN", { day:"2-digit", month:"short", year:"numeric" }) : "-";
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2400); }
function fillSelect(el, items, allLabel){
  el.innerHTML = (allLabel ? `<option value="">${allLabel}</option>` : "") + items.map(i => `<option>${i}</option>`).join("");
}

let reports = [], currentId = null, pendingAfter = null;

/* ------------------------ Dashboard summaries ----------------------- */
function renderStats(){
  const count = s => reports.filter(r => r.status === s).length;
  const cards = [["Total reports", reports.length, "#1b2a41"], ["New (Reported)", count("Reported"), "#b45309"],
                 ["In progress", count("In Progress"), "#7c3aed"], ["Resolved", count("Resolved"), "#15803d"]];
  $("stats").innerHTML = cards.map(c => `<div class="stat" style="--c:${c[2]}"><b>${c[1]}</b><span>${c[0]}</span></div>`).join("");

  const max = Math.max(1, ...CATEGORIES.map(c => reports.filter(r => r.category === c).length));
  $("catBars").innerHTML = CATEGORIES.map(c => {
    const n = reports.filter(r => r.category === c).length;
    return `<div class="bar-row"><span>${c}</span><div class="bar"><i style="width:${n / max * 100}%"></i></div><b>${n}</b></div>`;
  }).join("");

  $("pipe").innerHTML = STATUSES.map(s => `<div class="${cls(s)}"><span>${s}</span><span>${count(s)}</span></div>`).join("");
}

/* ------------------------------- Table ------------------------------ */
function renderTable(){
  const q = $("search").value.toLowerCase(), c = $("fCat").value, s = $("fStatus").value;
  const list = reports.filter(r =>
    (!c || r.category === c) && (!s || r.status === s) &&
    (`${r.title} ${addr(r)} ${r.id}`).toLowerCase().includes(q));

  if (!reports.length){
    $("rows").innerHTML = `<tr><td colspan="6" class="empty">No reports yet. Reports submitted by citizens will appear here.</td></tr>`;
    return;
  }
  $("rows").innerHTML = list.length ? list.map(r => `
    <tr>
      <td>${esc(r.id)}</td>
      <td><div class="cell-issue">
        ${r.photo ? `<img class="thumb" src="${esc(r.photo)}" alt="">` : `<span class="thumb">${ICONS[r.category] || "📌"}</span>`}
        <div>${esc(r.title)}<small>${esc(r.category)}</small></div></div></td>
      <td>${esc(addr(r))}</td>
      <td>${fmtDate(r.createdAt)}</td>
      <td>${badge(r.status)}</td>
      <td><button class="btn" data-id="${esc(r.id)}">View</button></td>
    </tr>`).join("")
    : `<tr><td colspan="6" class="empty">No reports match your filters. Clear the search or choose another category.</td></tr>`;
}

async function refresh(){
  try { reports = await Store.getAll(); }
  catch (e) { toast(e.message); reports = []; }
  renderStats(); renderTable();
}

/* ------------------------------- Modal ------------------------------ */
function openModal(id){
  const r = reports.find(x => x.id === id); if (!r) return;
  currentId = id; pendingAfter = r.afterPhoto || null;
  $("mTitle").textContent = r.title;
  $("mMeta").textContent = `${r.id} • Reported by ${r.reportedBy || "Unknown"} on ${fmtDate(r.createdAt)} • ${addr(r)}`;
  $("mDesc").textContent = r.description || "No description provided.";
  const loc = r.location || {};
  $("mMap").innerHTML = (loc.lat && loc.lng)
    ? `<a href="https://www.google.com/maps?q=${loc.lat},${loc.lng}" target="_blank" rel="noopener">Open location on map</a>` : "";
  fillSelect($("mStatus"), STATUSES); $("mStatus").value = r.status;
  fillSelect($("mCat"), CATEGORIES); $("mCat").value = r.category;
  $("mNote").value = r.adminNote || "";
  $("beforeBox").innerHTML = r.photo ? `<img src="${esc(r.photo)}" alt="Before">` : "No photo submitted";
  showAfter(); renderSteps(r.status);
  $("overlay").classList.add("open");
}
function renderSteps(status){
  const idx = STATUSES.indexOf(status);
  $("mSteps").innerHTML = STATUSES.map((s, i) => `<div class="${i <= idx ? "done" : ""}">${s}</div>`).join("");
}
function showAfter(){ $("afterBox").innerHTML = pendingAfter ? `<img src="${esc(pendingAfter)}" alt="After">` : "No image uploaded yet"; }
function closeModal(){ $("overlay").classList.remove("open"); $("afterFile").value = ""; }

async function saveReport(){
  const r = reports.find(x => x.id === currentId); if (!r) return;
  const updated = { ...r, status: $("mStatus").value, category: $("mCat").value, adminNote: $("mNote").value, afterPhoto: pendingAfter };
  try { await Store.update(updated); closeModal(); await refresh(); toast(`${updated.id} updated to ${updated.status}`); }
  catch (e) { toast(e.message); }
}
async function deleteReport(){
  if (!confirm("Delete this report permanently?")) return;
  try { await Store.remove(currentId); closeModal(); await refresh(); toast("Report deleted"); }
  catch (e) { toast(e.message); }
}

/* ----------------------------- Events ------------------------------- */
$("rows").addEventListener("click", e => { const b = e.target.closest("button[data-id]"); if (b) openModal(b.dataset.id); });
$("mStatus").addEventListener("change", e => renderSteps(e.target.value));
$("afterFile").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = () => { pendingAfter = fr.result; showAfter(); };
  fr.readAsDataURL(f);
});
$("saveBtn").addEventListener("click", saveReport);
$("deleteBtn").addEventListener("click", deleteReport);
$("cancelBtn").addEventListener("click", closeModal);
$("closeBtn").addEventListener("click", closeModal);
$("overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
$("menuBtn").addEventListener("click", () => $("sidebar").classList.toggle("open"));
["search", "fCat", "fStatus"].forEach(id => $(id).addEventListener("input", renderTable));
document.querySelectorAll(".sidebar a").forEach(a => a.addEventListener("click", () => {
  document.querySelectorAll(".sidebar a").forEach(x => x.classList.remove("active"));
  a.classList.add("active"); $("sidebar").classList.remove("open");
}));
// Auto-refresh when another tab (e.g. the report page) saves a new report
window.addEventListener("storage", e => { if (e.key === CONFIG.REPORTS_KEY) refresh(); });

fillSelect($("fCat"), CATEGORIES, "All categories");
fillSelect($("fStatus"), STATUSES, "All statuses");
refresh();
</script>
</body>
</html>
