<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Civic Snap - Report an Issue</title>

  <!-- Leaflet: the map library used for the "drop a pin" map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f766e 100%);
      color: #f8fafc;
      padding: 24px 20px;
    }

    /* Container Card */
    .report-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 36px 32px;
      width: 100%;
      max-width: 580px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 20px;
      padding: 8px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.25s ease;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-1px);
    }

    h2 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(to right, #38bdf8, #2dd4bf);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      color: #cbd5e1;
      margin: 18px 0 8px;
    }

    input[type="text"],
    textarea,
    input[type="file"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input[type="text"]:focus,
    textarea:focus {
      border-color: #38bdf8;
    }

    textarea {
      resize: vertical;
    }

    .char-count {
      color: #94a3b8;
      font-size: 0.8rem;
      text-align: right;
      margin-top: 4px;
    }

    /* Category Buttons */
    .categories {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .category {
      padding: 10px 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      color: #f8fafc;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .category:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .category.selected {
      background: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }

    /* Severity Radio Controls */
    .severity {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      background: rgba(255, 255, 255, 0.04);
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .severity label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      cursor: pointer;
      font-weight: 500;
      color: #e2e8f0;
    }

    /* Image Preview */
    #preview {
      margin-top: 12px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }

    #preview img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 8px;
      display: block;
      margin: 0 auto;
    }

    .remove {
      margin-top: 10px;
      padding: 6px 14px;
      background: rgba(248, 113, 113, 0.2);
      color: #f87171;
      border: 1px solid rgba(248, 113, 113, 0.4);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: background 0.2s ease;
    }

    .remove:hover {
      background: rgba(248, 113, 113, 0.35);
    }

    /* Submit Button */
    button[type="submit"] {
      width: 100%;
      margin-top: 28px;
      padding: 14px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      transition: all 0.25s ease;
    }

    button[type="submit"]:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
    }

    /* Response Message */
    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      text-align: center;
    }

    .success {
      background: rgba(52, 211, 153, 0.15);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.3);
    }

    .error {
      background: rgba(248, 113, 113, 0.15);
      color: #f87171;
      border: 1px solid rgba(248, 113, 113, 0.3);
    }

    footer {
      text-align: center;
      padding: 24px;
      color: #94a3b8;
      font-size: 0.85rem;
    }

    /* Map pin picker */
    #pickMap {
      height: 240px;
      width: 100%;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 0;
    }

    .map-hint {
      color: #94a3b8;
      font-size: 0.82rem;
      margin-top: 6px;
    }

    .gps-btn {
      margin-top: 10px;
      padding: 9px 14px;
      background: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
    }

    .gps-btn:hover {
      background: rgba(255, 255, 255, 0.16);
    }
  </style>
</head>

<body>
  <div class="report-card">
    <a href="/citizen_report.html" class="back-btn">&larr; Back to Map</a>

    <h2>Report an Issue</h2>
    <p class="subtitle">Choose an issue type, add a photo, and tell us where it is located.</p>

    <form id="reportForm">
      <label>Issue Category</label>
      <div class="categories">
        <button type="button" class="category selected" data-category="Road &amp; Potholes">Road &amp; Potholes</button>
        <button type="button" class="category" data-category="Waste Management">Waste Management</button>
        <button type="button" class="category" data-category="Drainage &amp; Sanitation">Drainage &amp; Sanitation</button>
        <button type="button" class="category" data-category="Street Lighting">Street Lighting</button>
        <button type="button" class="category" data-category="Public Infrastructure">Public Infrastructure</button>
        <button type="button" class="category" data-category="Water-related Issues">Water-related Issues</button>
        <button type="button" class="category" data-category="Other">Other</button>
      </div>

      <label for="photo">Upload a Photo</label>
      <input type="file" id="photo" accept="image/*">

      <div id="preview" hidden></div>

      <label for="description">Description</label>
      <textarea id="description" rows="4" maxlength="300" placeholder="Describe the problem..."></textarea>
      <div class="char-count"><span id="count">0</span>/300 characters</div>

      <label for="location">Location</label>
      <input type="text" id="location" placeholder="Enter street name or landmark">

      <label>Pin the exact spot</label>
      <div id="pickMap"></div>
      <div class="map-hint" id="mapHint">Tap the map to drop a pin, or use your current location. You can drag the pin to adjust it.</div>
      <button type="button" class="gps-btn" id="useGpsBtn">&#128205; Use my current location</button>

      <label>Severity</label>
      <div class="severity">
        <label><input type="radio" name="severity" value="Low" checked> Low</label>
        <label><input type="radio" name="severity" value="Medium"> Medium</label>
        <label><input type="radio" name="severity" value="High"> High</label>
      </div>

      <button type="submit">Submit Report</button>
      <div id="message" hidden aria-live="polite"></div>
    </form>
  </div>

  <footer>
    Civic Snap - Making our neighbourhoods better.
  </footer>

  <script>
    // ---------- Who is reporting? (must be logged in as a citizen) ----------
    const token = localStorage.getItem("userToken");
    if (!token || !localStorage.getItem("user")) {
      window.location.href = "/citizen.html";
    }

    // ---------- Page elements ----------
    const photoInput = document.getElementById("photo");
    const preview = document.getElementById("preview");
    const description = document.getElementById("description");
    const locationInput = document.getElementById("location");
    const count = document.getElementById("count");
    const form = document.getElementById("reportForm");
    const message = document.getElementById("message");
    const buttons = document.querySelectorAll(".category");
    const mapHint = document.getElementById("mapHint");

    let category = "Road & Potholes";
    let photoData = "";   // the (shrunk) photo as a base64 text string, ready to send to the server
    let pin = null;       // { lat, lng } chosen on the map

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
      message.hidden = text === "";
    }

    // ---------- Category buttons ----------
    buttons.forEach(function (button) {
      button.addEventListener("click", function () {
        category = button.dataset.category;
        buttons.forEach(function (item) { item.classList.remove("selected"); });
        button.classList.add("selected");
      });
    });

    // ---------- Photo: read it and shrink it (phone photos are huge) ----------
    function readAndShrink(file) {
      return new Promise(function (resolve, reject) {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = function () {
          const img = new Image();
          img.onerror = reject;
          img.onload = function () {
            const MAX = 1024; // longest side in pixels
            const scale = Math.min(1, MAX / Math.max(img.width, img.height));
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.75)); // JPEG, 75% quality
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    photoInput.addEventListener("change", async function () {
      const file = photoInput.files[0];
      if (!file) return;

      if (!file.type.startsWith("image/") || file.size > 10485760) {
        showMessage("Choose an image smaller than 10 MB.", "error");
        photoInput.value = "";
        return;
      }

      try {
        photoData = await readAndShrink(file);
      } catch (e) {
        showMessage("Could not read that photo. Try another one.", "error");
        photoInput.value = "";
        return;
      }

      const image = document.createElement("img");
      image.src = photoData;
      image.alt = "Selected issue photo";

      const removeButton = document.createElement("button");
      removeButton.type = "button";
      removeButton.className = "remove";
      removeButton.textContent = "Remove Photo";
      removeButton.addEventListener("click", function () {
        photoData = "";
        photoInput.value = "";
        preview.replaceChildren();
        preview.hidden = true;
      });

      preview.replaceChildren(image, removeButton);
      preview.hidden = false;
      showMessage("", "");
    });

    description.addEventListener("input", function () {
      count.textContent = description.value.length;
    });

    // ---------- Map: drop / drag a pin ----------
    const pickMap = L.map("pickMap").setView([12.9716, 77.5946], 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors",
      maxZoom: 19,
    }).addTo(pickMap);

    let pinMarker = null;
    let addressTypedByUser = false;

    locationInput.addEventListener("input", function () {
      addressTypedByUser = locationInput.value.trim() !== "";
    });

    // Turn the pin's coordinates into a readable address (only if the user hasn't typed one)
    function fillAddress(lat, lng) {
      if (addressTypedByUser) return;
      fetch("https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=" + lat + "&lon=" + lng)
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data && data.display_name && !addressTypedByUser) {
            locationInput.value = data.display_name.split(",").slice(0, 3).join(",").trim();
          }
        })
        .catch(function () { /* no internet for address lookup - user can type it */ });
    }

    function setPin(lat, lng) {
      pin = { lat: lat, lng: lng };

      if (pinMarker) {
        pinMarker.setLatLng([lat, lng]);
      } else {
        pinMarker = L.marker([lat, lng], { draggable: true }).addTo(pickMap);
        pinMarker.on("dragend", function () {
          const p = pinMarker.getLatLng();
          pin = { lat: p.lat, lng: p.lng };
          fillAddress(p.lat, p.lng);
        });
      }

      pickMap.setView([lat, lng], Math.max(pickMap.getZoom(), 16));
      mapHint.textContent = "Pin placed. Drag it if you need to adjust the spot.";
      fillAddress(lat, lng);
    }

    pickMap.on("click", function (e) { setPin(e.latlng.lat, e.latlng.lng); });

    function useMyLocation() {
      if (!navigator.geolocation) {
        mapHint.textContent = "Your browser has no GPS. Tap the map to drop a pin instead.";
        return;
      }
      mapHint.textContent = "Finding your location...";
      navigator.geolocation.getCurrentPosition(
        function (position) { setPin(position.coords.latitude, position.coords.longitude); },
        function () { mapHint.textContent = "Could not get your location. Tap the map to drop a pin instead."; },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    document.getElementById("useGpsBtn").addEventListener("click", useMyLocation);
    useMyLocation(); // try GPS automatically when the page opens

    // ---------- Submit ----------
    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (!photoData) { showMessage("Please upload a photo.", "error"); return; }
      if (description.value.trim() === "") { showMessage("Please describe the issue.", "error"); return; }
      if (locationInput.value.trim() === "") { showMessage("Please enter the location.", "error"); return; }
      if (!pin) { showMessage("Please drop a pin on the map so the issue shows up on the Community Map.", "error"); return; }

      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;

      try {
        const response = await fetch("/api/reports", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify({
            category: category,
            description: description.value.trim(),
            location: { address: locationInput.value.trim(), lat: pin.lat, lng: pin.lng },
            severity: document.querySelector('input[name="severity"]:checked').value,
            photo: photoData,
          }),
        });

        if (response.status === 401) {
          localStorage.removeItem("user");
          localStorage.removeItem("userToken");
          window.location.href = "/citizen.html";
          return;
        }

        const result = await response.json();
        if (!response.ok) throw new Error(result.message || "Could not save report");

        showMessage("Report saved successfully!", "success");
        setTimeout(function () { window.location.href = "/my_reports.html"; }, 1200);
      } catch (error) {
        showMessage(error.message, "error");
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
