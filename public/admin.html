<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civic Snap - Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f766e 100%);
            color: #f8fafc;
            padding: 20px;
            text-align: center;
        }

        .admin-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #38bdf8, #2dd4bf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        h3 {
            color: #e2e8f0;
            margin-top: 15px;
            margin-bottom: 20px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: #38bdf8;
        }

        button {
            width: 100%;
            padding: 12px 20px;
            margin-bottom: 12px;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-submit {
            background: #2563eb;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
        }

        .btn-submit:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .error-msg {
            color: #f87171;
            font-size: 0.85rem;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="admin-card">
        <h1>Civic Snap</h1>
        <button type="button" class="btn-secondary" onclick="window.location.href='/login.html';">Go back</button>
        <h3>Admin login</h3>

        <form id="adminLoginForm">
            <div class="input-group">
                <label for="adminUsername">Username</label>
                <input type="text" id="adminUsername" required placeholder="Enter admin username">
            </div>

            <div class="input-group">
                <label for="adminPassword">Password</label>
                <input type="password" id="adminPassword" required placeholder="Enter password">
            </div>

            <p id="errorMsg" class="error-msg"></p>

            <button type="submit" class="btn-submit">Submit</button>
            <button type="button" class="btn-secondary">Forgot password</button>
        </form>
    </div>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usernameInput = document.getElementById('adminUsername').value;
            const passwordInput = document.getElementById('adminPassword').value;
            const errorEl = document.getElementById('errorMsg');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameInput, password: passwordInput, role: 'admin' })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    if (result.role !== 'admin') {
                        errorEl.innerText = 'Unauthorized: Citizen accounts cannot log in here.';
                        errorEl.style.display = 'block';
                        return;
                    }

                    localStorage.setItem('adminUser', result.username);
                    localStorage.setItem('adminToken', result.token); // the login "pass" sent with every admin request
                    window.location.href = '/admin_dashboard.html';
                } else {
                    errorEl.innerText = result.message || 'Invalid username or password.';
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                console.error('Admin Login Fetch Error:', err);
                errorEl.innerText = 'Error connecting to backend server.';
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
