<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Civic Snap - My Reports</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f7f7;
    padding: 20px;
}
.header-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 8px;
}
@keyframes pageIn{from{opacity:0}to{opacity:1}}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
::selection{background:rgba(45,212,191,.35)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ---- background: faint contour lines that light up around the cursor ---- */
.topo,.topo-lit{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--topo) center/cover no-repeat}
.topo{opacity:.07}
.topo-lit{opacity:.5;
  -webkit-mask-image:radial-gradient(circle 230px at var(--mx) var(--my),#000 0,transparent 100%);
          mask-image:radial-gradient(circle 230px at var(--mx) var(--my),#000 0,transparent 100%)}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(420px circle at var(--mx) var(--my),rgba(45,212,191,.055),transparent 70%)}
.page{position:relative;z-index:1}

/* ---- type ---- */
.display{font-family:var(--display);text-transform:uppercase;font-weight:700;letter-spacing:-.005em;line-height:.98}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:18px;height:1px;background:var(--teal)}
.mono{font-family:var(--mono)}
.sub{color:var(--muted);font-size:.95rem}

/* ---- surfaces with HUD corner brackets ---- */
.panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hud{position:relative}
.hud::before{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;opacity:.5;transition:opacity .3s ease;
  background:
   linear-gradient(var(--teal),var(--teal)) top left/14px 1px no-repeat,
   linear-gradient(var(--teal),var(--teal)) top left/1px 14px no-repeat,
   linear-gradient(var(--teal),var(--teal)) top right/14px 1px no-repeat,
   linear-gradient(var(--teal),var(--teal)) top right/1px 14px no-repeat,
   linear-gradient(var(--teal),var(--teal)) bottom left/14px 1px no-repeat,
   linear-gradient(var(--teal),var(--teal)) bottom left/1px 14px no-repeat,
   linear-gradient(var(--teal),var(--teal)) bottom right/14px 1px no-repeat,
   linear-gradient(var(--teal),var(--teal)) bottom right/1px 14px no-repeat}
.hud:hover::before{opacity:1}
.panel h2,.panel-title{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel-title a{color:var(--teal);text-decoration:none}
.panel-title a:hover{text-decoration:underline}

/* ---- brand ---- */
.brand{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;font-size:1.15rem}
.brand-logo{display:block;width:auto;height:104px;max-width:520px;object-fit:contain;flex:0 0 auto}
.mark{width:18px;height:18px;border:1.5px solid var(--teal);border-radius:50%;position:relative;flex-shrink:0}
.mark::before,.mark::after{content:"";position:absolute;background:var(--teal)}
.mark::before{left:50%;top:-4px;bottom:-4px;width:1.5px;transform:translateX(-50%)}
.mark::after{top:50%;left:-4px;right:-4px;height:1.5px;transform:translateY(-50%)}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:10px;
  border:1px solid var(--line2);background:rgba(255,255,255,.06);color:var(--ink);font-weight:600;font-size:.9rem;
  cursor:pointer;text-decoration:none;transition:background .2s ease,transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.btn:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.small{padding:6px 12px;font-size:.8rem;border-radius:8px}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#04211d;box-shadow:0 6px 20px rgba(45,212,191,.22)}
.btn.primary:hover{background:#5eead4;box-shadow:0 8px 26px rgba(45,212,191,.34)}
.btn.success{background:#059669;border-color:#059669;color:#fff}
.btn.success:hover{background:#047857}
.btn.danger{background:rgba(248,113,113,.12);color:var(--danger);border-color:rgba(248,113,113,.32)}
.btn.danger:hover{background:rgba(248,113,113,.24)}
.btn.ghost{background:transparent}
.btn .arr{display:inline-block;transition:transform .2s ease}
.btn:hover .arr{transform:translateX(3px)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}

/* ---- forms ---- */
label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 7px;font-weight:500}
input[type=text],input[type=password],input[type=search],select,textarea{
  width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,.05);
  color:#fff;font-size:.95rem;outline:none;transition:border-color .2s ease,background .2s ease,box-shadow .2s ease}
input:focus,select:focus,textarea:focus{border-color:var(--teal);background:rgba(255,255,255,.08);box-shadow:0 0 0 3px rgba(45,212,191,.12)}
input::placeholder,textarea::placeholder{color:var(--dim)}
select option{background:#0f1c2d;color:#fff}
.msg{font-size:.85rem;margin:10px 0 0;display:none}
.error{color:var(--danger)}
.success{color:var(--success)}

/* ---- status badges ---- */
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.74rem;font-weight:600;white-space:nowrap;letter-spacing:.02em}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.Reported{background:rgba(251,191,36,.13);color:var(--s-reported)}
.Acknowledged{background:rgba(56,189,248,.13);color:var(--s-ack)}
.InProgress{background:rgba(167,139,250,.14);color:var(--s-prog)}
.Resolved{background:rgba(52,211,153,.13);color:var(--s-done)}

/* ---- scroll reveal (only hides things when JS is running) ---- */
.js [data-reveal]{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.js [data-reveal].in{opacity:1;transform:none}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(90px);opacity:0;pointer-events:none;background:#0b1626;border:1px solid var(--line2);
  color:#fff;padding:12px 22px;border-radius:10px;transition:transform .3s;z-index:99;box-shadow:0 12px 30px rgba(0,0,0,.5);font-size:.9rem}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .js [data-reveal]{opacity:1;transform:none}
  .topo-lit,.glow{display:none}
}
</style>
</head>
<body>

<div class="header-container">
    <h1>My Reports</h1>
    <div class="header-actions">
        <a href="add-issue.html" class="btn add-btn">+ Add Issue</a>
        <a href="citizen_report.html" class="btn map-btn">Community Map</a>
        <a href="login.html" class="btn logout-btn" id="logoutBtn">Logout</a>
    </div>
</div>
<p class="sub" id="subtitle">Loading your reports...</p>

<div class="grid" id="reportsContainer"></div>

<script>
    // ---------- Must be logged in as a citizen ----------
    var token = localStorage.getItem("userToken");
    var currentUser = localStorage.getItem("user");
    if (!token || !currentUser) {
        window.location.href = "citizen.html";
    }

    document.getElementById("logoutBtn").addEventListener("click", function () {
        localStorage.removeItem("user");
        localStorage.removeItem("userToken");
    });

    function esc(text) {
        return String(text == null ? "" : text).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
    }

    var container = document.getElementById("reportsContainer");

    // Ask the server for ONLY the reports submitted by the logged-in citizen
    fetch("/api/reports/mine", { headers: { Authorization: "Bearer " + token } })
        .then(function (response) {
            if (response.status === 401) {
                localStorage.removeItem("user");
                localStorage.removeItem("userToken");
                window.location.href = "citizen.html";
                throw new Error("Session expired");
            }
            return response.json();
        })
        .then(function (myReports) {
            document.getElementById("subtitle").textContent =
                "Logged in as " + currentUser + " - " + myReports.length +
                (myReports.length === 1 ? " report" : " reports") + " submitted";

            // Nothing reported yet
            if (myReports.length === 0) {
                container.innerHTML =
                    '<div class="empty" style="grid-column: 1 / -1;">' +
                    "<h3>You haven't reported anything yet</h3>" +
                    "<p>Spotted a pothole, garbage or a leak? Report it and it will show up here.</p>" +
                    '<a href="add-issue.html" class="btn add-btn">+ Report an issue</a></div>';
                return;
            }

            // Build one card per report
            var html = "";
            for (var i = 0; i < myReports.length; i++) {
                var r = myReports[i];
                var date = r.createdAt ? new Date(r.createdAt).toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" }) : "";
                var address = (r.location && r.location.address) || "";

                html += '<div class="report-card">' +
                    (r.photo ? '<img class="photo" src="' + esc(r.photo) + '" alt="Issue photo">' : "") +
                    '<div class="report-body">' +
                    "<h3>" + esc(r.title) + "</h3>" +
                    '<span class="badge ' + esc(String(r.status).replace(/\s/g, "")) + '">' + esc(r.status) + "</span>" +
                    "<p><b>" + esc(r.category) + "</b> &middot; " + esc(date) + "</p>" +
                    "<p>" + esc(address) + "</p>" +
                    (r.location && r.location.source === "camera" ? "<p>&#128247; Photo taken in the app with GPS</p>" : "") +
                    (r.location && r.location.source === "photo" ? "<p>&#128205; Pin placed from the photo's GPS tag</p>" : "") +
                    (r.adminNote ? '<div class="note"><b>Note from admin:</b> ' + esc(r.adminNote) + "</div>" : "") +
                    (r.afterPhoto ? '<div class="after"><p><b>After (resolved):</b></p><img src="' + esc(r.afterPhoto) + '" alt="After photo"></div>' : "") +
                    "</div></div>";
            }
            container.innerHTML = html;
        })
        .catch(function (error) {
            console.error("Could not load reports:", error);
            document.getElementById("subtitle").textContent = "Could not load your reports. Is the server running?";
        });
</script>

</body>
</html>
